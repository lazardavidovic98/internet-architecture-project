! R2 (2901) - running-config exported from src/ai-project.pkt
! Cisco Packet Tracer 8.1.1
!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R2
!
no ip cef
no ipv6 cef
!
license udi pid CISCO2901/K9 sn FTX1524LDA4-
!
spanning-tree mode pvst
!
interface GigabitEthernet0/0
 ip address 55.8.3.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 55.8.14.10 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0/0
 ip address 55.8.14.5 255.255.255.252
 clock rate 2000000
!
interface Serial0/0/1
 ip address 55.8.14.1 255.255.255.252
 clock rate 2000000
!
interface Serial0/1/0
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/1/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/2/0
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/2/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/3/0
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial0/3/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 8
 router-id 2.2.2.2
 log-adjacency-changes
 network 55.8.3.0 0.0.0.255 area 1
 network 55.8.14.0 0.0.0.3 area 1
 network 55.8.14.4 0.0.0.3 area 1
 network 55.8.14.8 0.0.0.3 area 0
!
ip classless
!
ip flow-export version 9
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
end
