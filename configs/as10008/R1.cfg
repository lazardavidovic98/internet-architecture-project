spanning-tree mode pvst
!
interface GigabitEthernet0/0
 ip address 55.8.2.1 255.255.255.0
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 ip address 55.8.14.9 255.255.255.252
 duplex auto
 speed auto
!
interface Serial0/0/0
 ip address 55.8.14.21 255.255.255.252
 clock rate 2000000
!
interface Serial0/0/1
 ip address 55.8.14.17 255.255.255.252
 clock rate 2000000
!
interface Serial0/1/0
 no ip address
 clock rate 2000000
